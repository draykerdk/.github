name: Open function
description: Define a concrete contribution that one person can deliver.
title: "[Open function] "
labels:
  - open-function
body:
  - type: markdown
    attributes:
      value: |
        An open function needs a concrete result and an entry point. Do not use this form for a broad vision or an internal management task.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, inconsistent or unverified?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence and sources
      description: Link the documents, code, issue or deployment this function starts from.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: What observable result completes this function?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: What is explicitly outside this function?
    validations:
      required: true
  - type: input
    id: validation
    attributes:
      label: Validation
      description: Which check, review or evidence will show that the result is complete?
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public-content check
      options:
        - label: This issue contains no credentials, private personal data or internal project-management information.
          required: true
